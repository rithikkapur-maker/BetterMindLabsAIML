<div x-show="activeMode === 'graphing'" class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <span>📊 Graphing Lab & Comprehensive Equation Matrix (80 Core Equations)</span>
        </h2>
        <template x-if="selectedGraphObj">
            <button @click="selectedGraphObj = null" class="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-300 bg-slate-900 border border-white/15 hover:bg-slate-800 hover:text-white transition-all self-start sm:self-auto shadow-lg">
                ← Back to Graph Library
            </button>
        </template>
    </div>

    <div class="flex items-center gap-2 bg-slate-900/80 p-1.5 rounded-2xl border border-white/10 overflow-x-auto shadow-inner">
        <template x-for="subj in graphSubjects" :key="subj.key">
            <button @click="selectedGraphSubject = subj.key; selectedGraphObj = null;"
                    :class="selectedGraphSubject === subj.key ? themeClasses.activeButton : 'text-slate-400 hover:text-white hover:bg-white/5'"
                    class="flex-1 min-w-[120px] py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 whitespace-nowrap">
                <span x-text="subj.icon" class="text-base"></span>
                <span x-text="subj.label"></span>
            </button>
        </template>
    </div>

    <template x-if="!selectedGraphObj">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 pt-2">
            <template x-for="g in (window.GRAPH_LIBRARY[selectedGraphSubject] || [])" :key="g.id">
                <button @click="selectGraph(g)" class="glass-panel glass-panel-hover text-left p-6 rounded-3xl border border-white/10 shadow-xl transition-all flex flex-col h-full">
                    <div class="flex items-center justify-between mb-3 w-full">
                        <span class="text-3xl drop-shadow-md" x-text="g.icon || '📈'"></span>
                        <span class="text-[10px] font-mono px-2.5 py-1 bg-white/5 border border-white/10 rounded-lg text-slate-400 shadow-inner" x-text="'#' + g.num"></span>
                    </div>
                    <div class="text-base font-extrabold text-white mb-1.5" x-text="g.title"></div>
                    <div class="text-xs font-mono text-cyan-400 mb-3 truncate tracking-wide bg-cyan-950/30 px-2 py-1 rounded-md inline-block w-fit border border-cyan-500/20" x-html="g.equation" x-show="g.equation"></div>
                    <div class="text-xs text-slate-400 leading-relaxed mt-auto" x-text="g.description"></div>
                </button>
            </template>
            <template x-if="!(window.GRAPH_LIBRARY[selectedGraphSubject] || []).length">
                <div class="col-span-full text-center py-16 text-slate-500 text-sm font-medium bg-slate-900/50 rounded-3xl border border-white/5">
                    No equations found for <span class="font-bold text-slate-400" x-text="selectedGraphSubject"></span>.
                </div>
            </template>
        </div>
    </template>

    <template x-if="selectedGraphObj">
        <div class="glass-panel p-8 rounded-3xl border border-white/10 space-y-6 shadow-2xl">
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-6 border-b border-white/10 pb-6">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-[10px] font-bold uppercase tracking-widest text-cyan-400" x-text="selectedGraphSubject"></span>
                        <span class="text-[10px] font-mono text-slate-400 bg-white/5 px-2 py-0.5 rounded border border-white/10" x-text="'Equation #' + selectedGraphObj.num"></span>
                    </div>
                    <h4 class="text-2xl font-extrabold text-white mb-4" x-text="selectedGraphObj.title"></h4>
                    
                    <div class="inline-block bg-slate-950/80 px-6 py-4 rounded-2xl border border-cyan-500/30 shadow-[0_0_20px_rgba(34,211,238,0.1)] font-mono text-cyan-300 text-xl sm:text-2xl tracking-wider mb-4" x-show="selectedGraphObj.equation" x-html="selectedGraphObj.equation"></div>
                    
                    <p class="text-sm text-slate-400 leading-relaxed max-w-2xl" x-text="selectedGraphObj.description"></p>
                </div>
            </div>

            <template x-if="selectedGraphObj.sliders && selectedGraphObj.sliders.length">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-950/60 p-6 rounded-2xl border border-white/5 shadow-inner">
                    <template x-for="slider in selectedGraphObj.sliders" :key="slider.variable">
                        <div class="space-y-3">
                            <div class="flex justify-between items-center text-xs font-bold">
                                <span class="text-slate-300 uppercase tracking-wider text-[10px]" x-text="slider.label"></span>
                                <span class="text-cyan-400 font-mono bg-cyan-950/40 px-2 py-1 rounded border border-cyan-800/50 shadow-sm" x-text="graphSliders[slider.variable].toFixed(2)"></span>
                            </div>
                            <input type="range"
                                   :min="slider.min"
                                   :max="slider.max"
                                   :step="slider.step"
                                   x-model.number="graphSliders[slider.variable]"
                                   :class="themeClasses.sliderAccent"
                                   class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer focus:outline-none transition-all">
                        </div>
                    </template>
                </div>
            </template>

            <div class="bg-slate-950 rounded-2xl border border-white/10 flex justify-center items-center overflow-hidden shadow-2xl w-full relative group">
                
                <div class="absolute right-4 top-4 flex flex-col z-10 shadow-xl rounded-xl overflow-hidden border border-white/20 opacity-70 hover:opacity-100 transition-opacity backdrop-blur-md">
                    <button @click="zoom(0.8)" class="w-10 h-10 bg-slate-900/80 hover:bg-slate-800 hover:text-cyan-400 text-white font-light text-2xl flex items-center justify-center transition-colors pb-1" title="Zoom In">+</button>
                    <div class="h-px w-full bg-white/20"></div>
                    <button @click="zoom(1.25)" class="w-10 h-10 bg-slate-900/80 hover:bg-slate-800 hover:text-cyan-400 text-white font-light text-3xl flex items-center justify-center transition-colors pb-1.5" title="Zoom Out">−</button>
                </div>

                <svg viewBox="60 40 380 200" 
                     class="w-full h-auto max-h-[550px] block cursor-crosshair" 
                     preserveAspectRatio="xMidYMid meet"
                     @wheel.prevent="zoom($event.deltaY > 0 ? 1.15 : 0.85)">
                    <defs>
                        <pattern id="minorGridLab" x="0" y="0" width="19" height="19" patternUnits="userSpaceOnUse">
                            <path d="M 19 0 L 0 0 0 19" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.5"/>
                        </pattern>
                        <pattern id="majorGridLab" x="0" y="0" width="76" height="76" patternUnits="userSpaceOnUse">
                            <rect width="76" height="76" fill="url(#minorGridLab)"/>
                            <path d="M 76 0 L 0 0 0 76" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
                        </pattern>
                        <filter id="neonGlowLab" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3.5" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <rect x="60" y="40" width="380" height="200" fill="url(#majorGridLab)"/>

                    <template x-for="lbl in dynamicYLabels" :key="lbl.value">
                        <line x1="60" :y1="lbl.y" x2="440" :y2="lbl.y" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                    </template>
                    <template x-for="lbl in dynamicXLabels" :key="lbl.value">
                        <line :x1="lbl.x" y1="40" :x2="lbl.x" y2="240" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                    </template>

                    <template x-if="originX !== null">
                        <line :x1="originX" y1="40" :x2="originX" y2="240" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
                    </template>
                    <template x-if="originY !== null">
                        <line x1="60" :y1="originY" x2="440" :y2="originY" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
                    </template>

                    <path :d="dynamicPathD" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path :d="dynamicPathD" fill="none" stroke="rgba(34, 211, 238, 0.4)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowLab)"/>
                    <path :d="dynamicPathD" fill="none" :stroke="themeClasses.chartLine" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

                    <template x-for="lbl in dynamicYLabels" :key="lbl.value">
                        <text x="64"
                              :y="lbl.y === 240 ? 236 : (lbl.y === 40 ? 48 : lbl.y + 3)"
                              fill="rgba(255,255,255,0.75)"
                              font-size="9"
                              text-anchor="start"
                              font-family="monospace"
                              font-weight="600"
                              x-show="parseFloat(lbl.value) !== 0"
                              x-text="lbl.value"></text>
                    </template>
                    
                    <template x-for="lbl in dynamicXLabels" :key="lbl.value">
                        <text :x="lbl.x === 60 ? 64 : (lbl.x === 440 ? 436 : lbl.x)"
                              y="236"
                              fill="rgba(255,255,255,0.75)"
                              font-size="9"
                              :text-anchor="lbl.x === 60 ? 'start' : (lbl.x === 440 ? 'end' : 'middle')"
                              font-family="monospace"
                              font-weight="600"
                              x-show="parseFloat(lbl.value) !== 0"
                              x-text="lbl.value"></text>
                    </template>

                    <template x-if="originX !== null && originY !== null">
                        <text :x="Math.max(64, originX - 6)"
                              :y="Math.min(236, originY + 12)"
                              fill="rgba(255,255,255,0.85)"
                              font-size="9"
                              text-anchor="end"
                              font-family="monospace"
                              font-weight="700">0</text>
                    </template>

                    <text x="436" :y="originY !== null ? Math.max(50, Math.min(232, originY - 6)) : 232" fill="#38bdf8" font-size="10" font-style="italic" font-weight="bold" text-anchor="end" x-text="selectedGraphObj.xAxis?.label || 'x'"></text>
                    <text :x="originX !== null ? Math.max(66, Math.min(430, originX + 6)) : 66" y="50" fill="#38bdf8" font-size="10" font-style="italic" font-weight="bold" text-anchor="start" x-text="selectedGraphObj.yAxis?.label || 'y'"></text>
                </svg>
            </div>
        </div>
    </template>
</div>
