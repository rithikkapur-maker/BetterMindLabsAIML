<!--
    ============================================================
    GRAPHING LAB (Mode 4)
    ============================================================
    This partial is pulled into templates/index.html via a Jinja
    include tag. It exists as its own file so the graph library can
    keep growing (Math / Chemistry / Physics / Biology) without
    index.html itself getting any bigger.

    It relies on Alpine state/methods already defined on the root
    x-data object in index.html:
      - activeMode, themeClasses
      - graphSubjects, selectedGraphSubject, selectedGraphObj
      - selectGraph(graph), graphSliders, graphBounds, zoom()
      - dynamicPathD, dynamicYLabels, dynamicXLabels, originX, originY
    and reads its graph definitions from window.GRAPH_LIBRARY,
    which is declared in the <script> block at the bottom of this file.
-->
<div x-show="activeMode === 'graphing'" class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <span>📊 Graphing Lab</span>
        </h2>
        <template x-if="selectedGraphObj">
            <button @click="selectedGraphObj = null" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-300 bg-slate-900 border border-white/15 hover:bg-slate-800 transition-all self-start sm:self-auto">
                ← Back to Graph Library
            </button>
        </template>
    </div>

    <!-- Subject Tabs: Math / Chemistry / Physics / Biology -->
    <div class="flex items-center gap-2 bg-slate-900/80 p-1.5 rounded-2xl border border-white/10 overflow-x-auto">
        <template x-for="subj in graphSubjects" :key="subj.key">
            <button @click="selectedGraphSubject = subj.key; selectedGraphObj = null;"
                    :class="selectedGraphSubject === subj.key ? themeClasses.activeButton : 'text-slate-400 hover:text-white hover:bg-white/5'"
                    class="flex-1 min-w-[110px] py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
                <span x-text="subj.icon"></span>
                <span x-text="subj.label"></span>
            </button>
        </template>
    </div>

    <!-- Graph Library Grid: pick a graph within the active subject -->
    <template x-if="!selectedGraphObj">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <template x-for="g in (window.GRAPH_LIBRARY[selectedGraphSubject] || [])" :key="g.id">
                <button @click="selectGraph(g)" class="glass-panel glass-panel-hover text-left p-5 rounded-2xl border border-white/10 shadow-xl transition-all">
                    <div class="text-2xl mb-2" x-text="g.icon || '📈'"></div>
                    <div class="text-sm font-bold text-white mb-1" x-text="g.title"></div>
                    <div class="text-xs text-slate-400 leading-relaxed" x-text="g.description"></div>
                </button>
            </template>
            <template x-if="!(window.GRAPH_LIBRARY[selectedGraphSubject] || []).length">
                <div class="col-span-full text-center py-16 text-slate-500 text-xs">
                    No graphs have been added to <span class="font-bold text-slate-400" x-text="selectedGraphSubject"></span> yet.
                </div>
            </template>
        </div>
    </template>

    <!-- Graph Viewer: same interactive plot engine used by Concept Alchemist -->
    <template x-if="selectedGraphObj">
        <div class="glass-panel p-8 rounded-3xl border border-white/10 space-y-6 shadow-2xl">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-cyan-400 block" x-text="selectedGraphSubject"></span>
                    <h4 class="text-lg font-bold text-white" x-text="selectedGraphObj.title"></h4>
                    <p class="text-xs text-slate-400 mt-1" x-text="selectedGraphObj.description"></p>
                </div>
                <div class="flex items-center gap-2">
                    <button @click="zoom(0.8)" class="px-3 py-1.5 bg-slate-900 border border-white/15 rounded-xl text-xs hover:bg-slate-800 text-slate-200 font-semibold transition-all">🔍 Zoom In</button>
                    <button @click="zoom(1.25)" class="px-3 py-1.5 bg-slate-900 border border-white/15 rounded-xl text-xs hover:bg-slate-800 text-slate-200 font-semibold transition-all">🔎 Zoom Out</button>
                </div>
            </div>

            <template x-if="selectedGraphObj.sliders && selectedGraphObj.sliders.length">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-950/80 p-5 rounded-2xl border border-white/10">
                    <template x-for="slider in selectedGraphObj.sliders" :key="slider.variable">
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs font-bold">
                                <span class="text-slate-300" x-text="slider.label"></span>
                                <span class="text-purple-400 font-mono" x-text="graphSliders[slider.variable]"></span>
                            </div>
                            <input type="range"
                                   :min="slider.min"
                                   :max="slider.max"
                                   :step="slider.step"
                                   x-model.number="graphSliders[slider.variable]"
                                   :class="themeClasses.sliderAccent"
                                   class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </template>
                </div>
            </template>

            <div class="bg-slate-950/90 rounded-2xl border border-white/10 p-4 flex justify-center items-center overflow-x-auto shadow-inner">
                <svg width="480" height="280" viewBox="0 0 480 280" class="overflow-visible">
                    <defs>
                        <pattern id="gridPatternGraphingLab" width="20" height="20" patternUnits="userSpaceOnUse">
                            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="480" height="280" fill="url(#gridPatternGraphingLab)" rx="8"/>

                    <line x1="60" y1="240" x2="440" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
                    <line x1="60" y1="40" x2="60" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

                    <template x-if="originX !== null">
                        <line :x1="originX" y1="40" :x2="originX" y2="240" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4,4" stroke-width="1.5"/>
                    </template>
                    <template x-if="originY !== null">
                        <line x1="60" :y1="originY" x2="440" :y2="originY" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4,4" stroke-width="1.5"/>
                    </template>

                    <path :d="dynamicPathD" fill="none" :stroke="themeClasses.chartLine" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

                    <template x-for="lbl in dynamicYLabels" :key="lbl.value">
                        <g>
                            <line x1="55" :y1="lbl.y" x2="60" :y2="lbl.y" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
                            <text x="50" :y="lbl.y + 4" fill="rgba(255,255,255,0.6)" font-size="9" text-anchor="end" font-family="monospace" x-text="lbl.value"></text>
                        </g>
                    </template>

                    <template x-for="lbl in dynamicXLabels" :key="lbl.value">
                        <g>
                            <line :x1="lbl.x" y1="240" :x2="lbl.x" y2="245" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
                            <text :x="lbl.x" y="258" fill="rgba(255,255,255,0.6)" font-size="9" text-anchor="middle" font-family="monospace" x-text="lbl.value"></text>
                        </g>
                    </template>

                    <text x="250" y="275" fill="#22d3ee" font-size="10" font-weight="bold" text-anchor="middle" x-text="selectedGraphObj.xAxis?.label || 'x'"></text>
                    <text x="20" y="140" fill="#22d3ee" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 20 140)" x-text="selectedGraphObj.yAxis?.label || 'y'"></text>
                </svg>
            </div>
        </div>
    </template>
</div>

<script>
    // ============================================================
    // GRAPH LIBRARY DATA
    // ============================================================
    // Add new graphs here under the relevant subject array. This is the
    // ONLY place you need to touch to grow the Graphing Lab — nothing in
    // index.html needs to change.
    //
    // Schema for each graph object:
    // {
    //   id:          unique string
    //   icon:        emoji shown on the card (optional, defaults to 📈)
    //   title:       card + viewer heading
    //   description: one-line summary shown on the card and in the viewer
    //   expression:  JS math expression string, MUST reference "x"
    //                (Math.*, sin/cos/tan/pow/sqrt/abs/exp/log/pi/e are
    //                available unprefixed, same as the AI-generated graphs)
    //   xAxis:       { label, min, max }
    //   yAxis:       { label, min, max }
    //   sliders:     [ { variable, label, min, max, value, step } ]
    //                (omit or use [] for a graph with no adjustable
    //                parameters; every slider "variable" must appear in
    //                the expression)
    // }
    window.GRAPH_LIBRARY = {
        Math: [
            {
                id: 'quadratic-function',
                icon: '📐',
                title: 'Quadratic Function',
                description: 'See how a, b, and c reshape a parabola: y = ax² + bx + c.',
                expression: 'a * x * x + b * x + c',
                xAxis: { label: 'x', min: -10, max: 10 },
                yAxis: { label: 'y', min: -10, max: 10 },
                sliders: [
                    { variable: 'a', label: 'a (curvature)', min: -3, max: 3, value: 1, step: 0.1 },
                    { variable: 'b', label: 'b (tilt)', min: -5, max: 5, value: 0, step: 0.1 },
                    { variable: 'c', label: 'c (vertical shift)', min: -5, max: 5, value: 0, step: 0.5 }
                ]
            },
            {
                id: 'sine-wave',
                icon: '🌊',
                title: 'Sine Wave',
                description: 'Amplitude, frequency, and phase shift of y = A·sin(Bx + C).',
                expression: 'A * Math.sin(B * x + C)',
                xAxis: { label: 'x (radians)', min: -10, max: 10 },
                yAxis: { label: 'y', min: -6, max: 6 },
                sliders: [
                    { variable: 'A', label: 'Amplitude A', min: 0.5, max: 5, value: 2, step: 0.1 },
                    { variable: 'B', label: 'Frequency B', min: 0.2, max: 4, value: 1, step: 0.1 },
                    { variable: 'C', label: 'Phase Shift C', min: -3.14, max: 3.14, value: 0, step: 0.1 }
                ]
            },
            {
                id: 'exponential-growth',
                icon: '📈',
                title: 'Exponential Function',
                description: 'y = a·bˣ — the building block for growth and decay curves.',
                expression: 'a * Math.pow(b, x)',
                xAxis: { label: 'x', min: -5, max: 5 },
                yAxis: { label: 'y', min: -2, max: 20 },
                sliders: [
                    { variable: 'a', label: 'Initial value a', min: 0.1, max: 5, value: 1, step: 0.1 },
                    { variable: 'b', label: 'Base b', min: 0.2, max: 3, value: 1.5, step: 0.05 }
                ]
            }
        ],
        Chemistry: [
            {
                id: 'radioactive-decay',
                icon: '☢️',
                title: 'Radioactive Decay',
                description: 'N(t) = N₀·e^(−λt), remaining quantity of an isotope over time.',
                expression: 'N0 * Math.exp(-lambda * x)',
                xAxis: { label: 'time (t)', min: 0, max: 20 },
                yAxis: { label: 'N(t)', min: 0, max: 100 },
                sliders: [
                    { variable: 'N0', label: 'Initial Amount N₀', min: 10, max: 100, value: 100, step: 5 },
                    { variable: 'lambda', label: 'Decay Constant λ', min: 0.05, max: 1, value: 0.2, step: 0.01 }
                ]
            },
            {
                id: 'arrhenius-equation',
                icon: '🔥',
                title: 'Arrhenius Equation',
                description: 'How rate constant k grows with temperature: k = A·e^(−Ea / x).',
                expression: 'A * Math.exp(-Ea / x)',
                xAxis: { label: 'Temperature (K)', min: 100, max: 1000 },
                yAxis: { label: 'Rate Constant k', min: 0, max: 10 },
                sliders: [
                    { variable: 'A', label: 'Pre-exponential Factor A', min: 1, max: 10, value: 8, step: 0.5 },
                    { variable: 'Ea', label: 'Activation Energy Ea', min: 100, max: 2000, value: 500, step: 50 }
                ]
            },
            {
                id: 'ideal-gas-law',
                icon: '🧪',
                title: 'Ideal Gas Law (P vs V)',
                description: 'Pressure vs. volume at fixed temperature: P = nRT / V.',
                expression: 'n * R * T / x',
                xAxis: { label: 'Volume (L)', min: 1, max: 20 },
                yAxis: { label: 'Pressure (atm)', min: 0, max: 50 },
                sliders: [
                    { variable: 'n', label: 'Moles n', min: 0.5, max: 5, value: 1, step: 0.1 },
                    { variable: 'T', label: 'Temperature T (K)', min: 100, max: 500, value: 298, step: 10 }
                ]
            }
        ],
        Physics: [
            {
                id: 'projectile-motion',
                icon: '🎯',
                title: 'Projectile Motion',
                description: 'Trajectory height vs. horizontal distance for launch angle & speed.',
                expression: 'x * Math.tan(theta * Math.PI / 180) - (9.8 * x * x) / (2 * Math.pow(v0 * Math.cos(theta * Math.PI / 180), 2))',
                xAxis: { label: 'Horizontal Distance (m)', min: 0, max: 50 },
                yAxis: { label: 'Height (m)', min: 0, max: 30 },
                sliders: [
                    { variable: 'v0', label: 'Initial Speed v₀ (m/s)', min: 5, max: 40, value: 20, step: 1 },
                    { variable: 'theta', label: 'Launch Angle θ (°)', min: 5, max: 85, value: 45, step: 1 }
                ]
            },
            {
                id: 'simple-harmonic-motion',
                icon: '🔁',
                title: 'Simple Harmonic Motion',
                description: 'Position over time for a mass on a spring: x(t) = A·cos(ωt).',
                expression: 'A * Math.cos(omega * x)',
                xAxis: { label: 'Time (s)', min: 0, max: 10 },
                yAxis: { label: 'Displacement', min: -5, max: 5 },
                sliders: [
                    { variable: 'A', label: 'Amplitude A', min: 0.5, max: 5, value: 2, step: 0.1 },
                    { variable: 'omega', label: 'Angular Frequency ω', min: 0.5, max: 6, value: 2, step: 0.1 }
                ]
            },
            {
                id: 'ohms-law',
                icon: '🔌',
                title: "Ohm's Law (I vs V)",
                description: 'Current vs. voltage for a fixed resistance: I = V / R.',
                expression: 'x / R',
                xAxis: { label: 'Voltage (V)', min: 0, max: 20 },
                yAxis: { label: 'Current (A)', min: 0, max: 10 },
                sliders: [
                    { variable: 'R', label: 'Resistance R (Ω)', min: 1, max: 20, value: 5, step: 0.5 }
                ]
            }
        ],
        Biology: [
            {
                id: 'logistic-population-growth',
                icon: '🌱',
                title: 'Logistic Population Growth',
                description: 'Population size approaching carrying capacity K over time.',
                expression: 'K / (1 + ((K - N0) / N0) * Math.exp(-r * x))',
                xAxis: { label: 'Time (t)', min: 0, max: 50 },
                yAxis: { label: 'Population', min: 0, max: 1000 },
                sliders: [
                    { variable: 'K', label: 'Carrying Capacity K', min: 100, max: 1000, value: 500, step: 50 },
                    { variable: 'N0', label: 'Initial Population N₀', min: 1, max: 100, value: 10, step: 1 },
                    { variable: 'r', label: 'Growth Rate r', min: 0.05, max: 1, value: 0.3, step: 0.05 }
                ]
            },
            {
                id: 'michaelis-menten',
                icon: '🧬',
                title: 'Michaelis–Menten Kinetics',
                description: 'Enzyme reaction rate vs. substrate concentration: v = Vmax·[S] / (Km + [S]).',
                expression: '(Vmax * x) / (Km + x)',
                xAxis: { label: 'Substrate Concentration [S]', min: 0, max: 50 },
                yAxis: { label: 'Reaction Rate v', min: 0, max: 12 },
                sliders: [
                    { variable: 'Vmax', label: 'Max Rate Vmax', min: 1, max: 15, value: 10, step: 0.5 },
                    { variable: 'Km', label: 'Michaelis Constant Km', min: 1, max: 30, value: 8, step: 1 }
                ]
            },
            {
                id: 'exponential-bacterial-growth',
                icon: '🦠',
                title: 'Exponential Bacterial Growth',
                description: 'Colony size over time before resources become limiting: N = N₀·e^(rt).',
                expression: 'N0 * Math.exp(r * x)',
                xAxis: { label: 'Time (hours)', min: 0, max: 10 },
                yAxis: { label: 'Population', min: 0, max: 1000 },
                sliders: [
                    { variable: 'N0', label: 'Initial Population N₀', min: 1, max: 100, value: 20, step: 1 },
                    { variable: 'r', label: 'Growth Rate r', min: 0.1, max: 1.5, value: 0.6, step: 0.05 }
                ]
            }
        ]
    };
</script>
