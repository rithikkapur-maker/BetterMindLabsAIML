    <style>
        /* Hide elements before Alpine JS is initialized */
        [x-cloak] { display: none !important; }

        /* Custom Glassmorphism Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .glass-panel-hover {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel-hover:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.02) 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.5s infinite;
        }
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 3D Dynamic Card-Flip Mechanics Structural Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        @keyframes reactbits-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.08); }
        }
        .animate-reactbits-glow {
            animation: reactbits-glow 7s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

        async initSupabase() {
            let url = window.SUPABASE_URL || localStorage.getItem('SUPABASE_URL') || '';
            let key = window.SUPABASE_ANON_KEY || localStorage.getItem('SUPABASE_ANON_KEY') || '';
            
            this.supabaseUrlInput = url;
            this.supabaseAnonKeyInput = key;

            if (window.supabase && url && key && url !== 'None') {
                try {
                    this.supabase = window.supabase.createClient(url, key);
                    const { data: { session } } = await this.supabase.auth.getSession();
                    this.session = session;
                    this.user = session?.user || null;
                    this.currentView = 'landing';

                    this.supabase.auth.onAuthStateChange((event, session) => {
                        this.session = session;
                        this.user = session?.user || null;
                        if (event === 'SIGNED_IN') {
                            this.showAuthModal = false;
                            this.currentView = 'app';
                        }
                    });
                } catch(e) {
                    console.error('Supabase init failure:', e);
                }
            }
            this.isCheckingAuth = false;
            
            this.$nextTick(() => {
                initReactBitsCanvases(this);
            });
        },

        saveSupabaseConfig() {
            if (this.supabaseUrlInput && this.supabaseAnonKeyInput) {
                localStorage.setItem('SUPABASE_URL', this.supabaseUrlInput);
                localStorage.setItem('SUPABASE_ANON_KEY', this.supabaseAnonKeyInput);
                window.SUPABASE_URL = this.supabaseUrlInput;
                window.SUPABASE_ANON_KEY = this.supabaseAnonKeyInput;
                this.initSupabase();
                this.authSuccess = 'Supabase credentials updated successfully!';
                this.authError = '';
            } else {
                this.authError = 'Please fill both Supabase URL and Anon Key.';
            }
        },

        async signInWithGoogle() {
            this.authError = '';
            this.authSuccess = '';
            if (!this.supabase) {
                this.authError = 'Supabase client is not configured yet. Please configure SUPABASE_URL and SUPABASE_ANON_KEY below.';
                this.showSupabaseConfig = true;
                return;
            }
            this.authLoading = true;
            try {
                const { error } = await this.supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin
                    }
                });
                if (error) throw error;
            } catch (err) {
                this.authError = err.message || 'Google login failed.';
            } finally {
                this.authLoading = false;
            }
        },

        async handleEmailAuth() {
            this.authError = '';
            this.authSuccess = '';
            if (!this.supabase) {
                this.authError = 'Supabase client is not configured yet. Please configure SUPABASE_URL and SUPABASE_ANON_KEY below.';
                this.showSupabaseConfig = true;
                return;
            }
            if (!this.authEmail || !this.authPassword) {
                this.authError = 'Please enter both email and password.';
                return;
            }
            if (this.authTab === 'signup' && !this.authName) {
                this.authError = 'Please enter your full name.';
                return;
            }

            this.authLoading = true;
            try {
                if (this.authTab === 'signup') {
                    const { data, error } = await this.supabase.auth.signUp({
                        email: this.authEmail,
                        password: this.authPassword,
                        options: {
                            data: { full_name: this.authName }
                        }
                    });
                    if (error) throw error;
                    if (data.user && !data.session) {
                        this.authSuccess = 'Account registered! Please check your email inbox to verify your account.';
                    } else {
                        this.authSuccess = 'Account created successfully!';
                        this.showAuthModal = false;
                        this.currentView = 'app';
                    }
                } else {
                    const { data, error } = await this.supabase.auth.signInWithPassword({
                        email: this.authEmail,
                        password: this.authPassword
                    });
                    if (error) throw error;
                    this.showAuthModal = false;
                    this.currentView = 'app';
                }
            } catch (err) {
                this.authError = err.message || 'Authentication operation failed.';
            } finally {
                this.authLoading = false;
            }
        },

        async handleSignOut() {
            if (this.supabase) {
                await this.supabase.auth.signOut();
            }
            this.user = null;
            this.session = null;
            this.currentView = 'landing';
        },

        evaluateGraphExpression(expression, x, variables) {
            try {
                const context = {
                    x: x,
                    ...variables,
                    Math: Math,
                    sin: Math.sin,
                    cos: Math.cos,
                    tan: Math.tan,
                    pow: Math.pow,
                    sqrt: Math.sqrt,
                    abs: Math.abs,
                    exp: Math.exp,
                    log: Math.log,
                    pi: Math.PI,
                    PI: Math.PI,
                    e: Math.E
                };
                
                const keys = Object.keys(context);
                const values = Object.values(context);
                const fn = new Function(...keys, `return (${expression});`);
                return fn(...values);
            } catch (err) {
                return NaN;
            }
        },

        zoom(factor) {
            const currentXMin = parseFloat(this.graphBounds.xMin);
            const currentXMax = parseFloat(this.graphBounds.xMax);
            const currentYMin = parseFloat(this.graphBounds.yMin);
            const currentYMax = parseFloat(this.graphBounds.yMax);
            
            const xCenter = (currentXMin + currentXMax) / 2;
            const yCenter = (currentYMin + currentYMax) / 2;
            
            const halfXRange = ((currentXMax - currentXMin) / 2) * factor;
            const halfYRange = ((currentYMax - currentYMin) / 2) * factor;
            
            this.graphBounds.xMin = parseFloat((xCenter - halfXRange).toFixed(4));
            this.graphBounds.xMax = parseFloat((xCenter + halfXRange).toFixed(4));
            this.graphBounds.yMin = parseFloat((yCenter - halfYRange).toFixed(4));
            this.graphBounds.yMax = parseFloat((yCenter + halfYRange).toFixed(4));
        },

        // Returns whichever graph spec should currently be plotted, regardless
        // of whether it came from the AI (Concept Alchemist) or from the
        // static GRAPH_LIBRARY (Graphing Lab). Every plotting getter below
        // reads from here so both modes reuse the exact same chart engine.
        get activeGraphSpec() {
            if (this.activeMode === 'graphing') {
                return this.selectedGraphObj;
            }
            return (this.alchemistResult && this.alchemistResult.interactive_graph)
                ? this.alchemistResult.interactive_graph
                : null;
        },

        selectGraph(graph) {
            this.selectedGraphObj = graph;
            this.graphSliders = {};
            if (graph.sliders && graph.sliders.length) {
                graph.sliders.forEach(slider => {
                    this.graphSliders[slider.variable] = parseFloat(slider.value);
                });
            }
            this.graphBounds.xMin = parseFloat(graph.xAxis.min);
            this.graphBounds.xMax = parseFloat(graph.xAxis.max);
            this.graphBounds.yMin = parseFloat(graph.yAxis.min);
            this.graphBounds.yMax = parseFloat(graph.yAxis.max);
        },

        get originX() {
            const minX = parseFloat(this.graphBounds.xMin);
            const maxX = parseFloat(this.graphBounds.xMax);
            const xRange = (maxX - minX) || 1;
            const marginX = 60;
            const chartWidth = 380;
            if (minX <= 0 && 0 <= maxX) {
                return marginX + ((0 - minX) / xRange) * chartWidth;
            }
            return null;
        },

        get originY() {
            const minY = parseFloat(this.graphBounds.yMin);
            const maxY = parseFloat(this.graphBounds.yMax);
            const yRange = (maxY - minY) || 1;
            const marginY = 40;
            const chartHeight = 200;
            if (minY <= 0 && 0 <= maxY) {
                return (marginY + chartHeight) - ((0 - minY) / yRange) * chartHeight;
            }
            return null;
        },

        get dynamicPoints() {
            if (!this.activeGraphSpec) return [];
            const graph = this.activeGraphSpec;
            const minX = parseFloat(this.graphBounds.xMin);
            const maxX = parseFloat(this.graphBounds.xMax);
            const stepX = parseFloat(graph.xAxis.step) || (maxX - minX) / 100;
            const expression = graph.expression;
            
            let pts = [];
            let yVals = [];
            
            for (let x = minX; x <= maxX; x += stepX) {
                let y = this.evaluateGraphExpression(expression, x, this.graphSliders);
                if (!isNaN(y) && isFinite(y)) {
                    yVals.push({ x: x, y: y });
                }
            }
            
            if (yVals.length === 0) return [];
            
            const xRange = (maxX - minX) || 1;
            const minY = parseFloat(this.graphBounds.yMin);
            const maxY = parseFloat(this.graphBounds.yMax);
            const yRange = (maxY - minY) || 1;
            
            const marginX = 60;
            const marginY = 40;
            const chartWidth = 380;
            const chartHeight = 200;
            
            return yVals.map(p => {
                let screenX = marginX + ((p.x - minX) / xRange) * chartWidth;
                let screenY = (marginY + chartHeight) - ((p.y - minY) / yRange) * chartHeight;
                return { mathX: p.x, mathY: p.y, screenX: screenX, screenY: screenY };
            });
        },

        get dynamicPathD() {
            const pts = this.dynamicPoints;
            if (pts.length === 0) return '';
            const marginX = 60;
            const marginY = 40;
            const chartWidth = 380;
            const chartHeight = 200;
            const minXBound = marginX;
            const maxXBound = marginX + chartWidth;
            const minYBound = marginY;
            const maxYBound = marginY + chartHeight;

            let path = '';
            let first = true;

            pts.forEach(pt => {
                if (pt.screenY >= minYBound && pt.screenY <= maxYBound && pt.screenX >= minXBound && pt.screenX <= maxXBound) {
                    path += `${first ? 'M' : 'L'} ${pt.screenX} ${pt.screenY} `;
                    first = false;
                } else {
                    first = true;
                }
            });
            return path.trim();
        },

        get dynamicYLabels() {
            if (!this.activeGraphSpec) return [];
            const minY = parseFloat(this.graphBounds.yMin);
            const maxY = parseFloat(this.graphBounds.yMax);
            const range = maxY - minY;
            const marginY = 40;
            const chartHeight = 200;
            
            let labels = [];
            for (let i = 0; i <= 4; i++) {
                let val = minY + (range * (i / 4));
                let screenY = (marginY + chartHeight) - (i / 4) * chartHeight;
                labels.push({ value: val.toFixed(2), y: screenY });
            }
            return labels;
        },

        get dynamicXLabels() {
            if (!this.activeGraphSpec) return [];
            const minX = parseFloat(this.graphBounds.xMin);
            const maxX = parseFloat(this.graphBounds.xMax);
            const range = maxX - minX;
            const marginX = 60;
            const chartWidth = 380;
            
            let labels = [];
            for (let i = 0; i <= 4; i++) {
                let val = minX + (range * (i / 4));
                let screenX = marginX + (i / 4) * chartWidth;
                labels.push({ value: val.toFixed(2), x: screenX });
            }
            return labels;
        },

                return;
            }
            this.errorAlchemist = '';
            this.loadingAlchemist = true;
            this.alchemistResult = null;
            this.graphSliders = {};
            try {
                let response = await fetch('/api/morph-concept', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        topic: this.topic, 
                        profile: this.profile, 
                        depth: this.currentDepth 
                    })
                });
                let data = await response.json();
                if(response.ok) {
                    this.alchemistResult = data;
                    if (data.interactive_graph && data.interactive_graph.sliders) {
                        data.interactive_graph.sliders.forEach(slider => {
                            this.graphSliders[slider.variable] = parseFloat(slider.value);
                        });
                        this.graphBounds.xMin = parseFloat(data.interactive_graph.xAxis.min);
                        this.graphBounds.xMax = parseFloat(data.interactive_graph.xAxis.max);
                        this.graphBounds.yMin = parseFloat(data.interactive_graph.yAxis.min);
                        this.graphBounds.yMax = parseFloat(data.interactive_graph.yAxis.max);
                    }
                } else {
                    this.errorAlchemist = data.error || 'A transformation anomaly occurred.';
                }
            } catch (e) {
                this.errorAlchemist = 'Network breakdown. Ensure Vercel environment routines are stable.';
            } finally {
                this.loadingAlchemist = false;
            }
        },

        async triggerForge() {
            if(!this.topic.trim()) {
                this.errorForge = 'Please define a topic base inside the workspace input first.';
                return;
            }
            this.errorForge = '';
            this.loadingForge = true;
            this.forgeItems = [];
            this.quizAnswers = {};
            this.quizSubmitted = {};
            this.totalCorrect = 0;
            this.totalAnswered = 0;
            try {
                let response = await fetch('/api/generate-evaluation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        topic: this.topic, 
                        type: this.evalType, 
                        difficulty: this.difficulty,
                        gap_history: this.sessionWeakGaps
                    })
                });
                let data = await response.json();
                if(response.ok && data.items) {
                    this.forgeItems = data.items.map(item => ({ ...item, flipped: false }));
                } else {
                    this.errorForge = data.error || 'An evaluation parsing matrix failure occurred.';
                }
            } catch(e) {
                this.errorForge = 'Connection to Evaluation Forge runtime execution disrupted.';
            } finally {
                this.loadingForge = false;
            }
        },

        async triggerResearch() {
            if(!this.topic.trim()) {
                this.errorResearch = 'Please enter a target research topic.';
                return;
            }
            this.errorResearch = '';
            this.loadingResearch = true;
            this.researchResult = null;
            try {
                let response = await fetch('/api/generate-research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        topic: this.topic, 
                        profile: this.profile, 
                        depth: this.currentDepth 
                    })
                });
                let data = await response.json();
                if(response.ok) {
                    this.researchResult = data;
                } else {
                    this.errorResearch = data.error || 'A research assembly failure occurred.';
                }
            } catch (e) {
                this.errorResearch = 'Network connection to the Research Director was lost.';
            } finally {
                this.loadingResearch = false;
            }
        },

        selectOption(qIndex, optIndex, correctIndex) {
            if(this.quizSubmitted[qIndex]) return;
            this.quizAnswers[qIndex] = optIndex;
            this.quizSubmitted[qIndex] = true;
            this.totalAnswered++;
            if(optIndex === correctIndex) {
                this.totalCorrect++;
            } else {
                let questionText = this.forgeItems[qIndex].question;
                if(!this.sessionWeakGaps.includes(questionText)) {
                    this.sessionWeakGaps.push(questionText);
                }
            }
        },

        async submitFeedback() {
            if(!this.feedbackMessage.trim()) {
                this.feedbackError = 'Please enter your feedback before submitting.';
                return;
            }
            this.feedbackError = '';
            this.feedbackLoading = true;
            try {
                let response = await fetch('/api/send-feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: this.feedbackMessage,
                        name: this.feedbackName,
                        email: this.feedbackEmail,
                        category: this.feedbackCategory
                    })
                });
                let data = await response.json();
                if(response.ok && data.success) {
                    this.feedbackSuccess = true;
                    this.feedbackMessage = '';
                    this.feedbackName = '';
                    this.feedbackEmail = '';
                    this.feedbackCategory = 'General';
                } else {
                    this.feedbackError = data.error || 'Failed to send feedback. Please try again.';
                }
            } catch (e) {
                this.feedbackError = 'Network error. Could not reach the feedback service.';
            } finally {
                this.feedbackLoading = false;
            }
        }
    }"

    <script>
        function initReactBitsCanvases(alpineScope) {
            // 1. Color Bends Canvas Initialization
            const bendsCanvas = document.getElementById('color-bends-canvas');
            if (bendsCanvas) {
                const ctx = bendsCanvas.getContext('2d');
                let width = bendsCanvas.width = window.innerWidth;
                let height = bendsCanvas.height = window.innerHeight;

                window.addEventListener('resize', () => {
                    width = bendsCanvas.width = window.innerWidth;
                    height = bendsCanvas.height = window.innerHeight;
                });

                let step = 0;
                function renderBends() {
                    ctx.clearRect(0, 0, width, height);
                    step += 0.008;

                    const bendsColor = (alpineScope && alpineScope.themeClasses) ? alpineScope.themeClasses.bendsColor : '#A855F7';

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(0, height * 0.5);

                    for (let x = 0; x <= width; x += 20) {
                        const y = height * 0.5 + Math.sin(x * 0.003 + step) * 120 + Math.cos(x * 0.005 + step * 1.5) * 60;
                        ctx.lineTo(x, y);
                    }

                    ctx.lineTo(width, height);
                    ctx.lineTo(0, height);
                    ctx.closePath();

                    const grad = ctx.createLinearGradient(0, 0, width, height);
                    grad.addColorStop(0, bendsColor + '1A'); // 10% opacity
                    grad.addColorStop(0.5, bendsColor + '33'); // 20% opacity
                    grad.addColorStop(1, '#00000000');

                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.restore();

                    requestAnimationFrame(renderBends);
                }
                renderBends();
            }

            // 2. Interactive Dot Field Canvas Initialization
            const dotCanvas = document.getElementById('dot-field-canvas');
            if (dotCanvas) {
                const ctx = dotCanvas.getContext('2d');
                let width = dotCanvas.width = window.innerWidth;
                let height = dotCanvas.height = window.innerHeight;

                window.addEventListener('resize', () => {
                    width = dotCanvas.width = window.innerWidth;
                    height = dotCanvas.height = window.innerHeight;
                });

                let mouseX = -1000;
                let mouseY = -1000;

                dotCanvas.addEventListener('mousemove', (e) => {
                    const rect = dotCanvas.getBoundingClientRect();
                    mouseX = e.clientX - rect.left;
                    mouseY = e.clientY - rect.top;
                });

                dotCanvas.addEventListener('mouseleave', () => {
                    mouseX = -1000;
                    mouseY = -1000;
                });

                const spacing = 32;
                const dotRadius = 1.5;
                const cursorRadius = 140;
                const glowRadius = 90;
                const bulgeStrength = 0.8;
                const cursorForce = 1.2;

                function renderDotField() {
                    ctx.clearRect(0, 0, width, height);

                    const activeColorHex = (alpineScope && alpineScope.themeClasses) ? alpineScope.themeClasses.bendsColor : '#A855F7';

                    for (let x = spacing / 2; x < width; x += spacing) {
                        for (let y = spacing / 2; y < height; y += spacing) {
                            const dx = mouseX - x;
                            const dy = mouseY - y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            let drawX = x;
                            let drawY = y;
                            let currentRadius = dotRadius;
                            let alpha = 0.2;
                            let isGlowing = false;

                            if (dist < cursorRadius && dist > 0) {
                                const factor = (1 - dist / cursorRadius);
                                const displacement = factor * bulgeStrength * cursorForce * 12;
                                drawX -= (dx / dist) * displacement;
                                drawY -= (dy / dist) * displacement;
                            }

                            if (dist < glowRadius) {
                                const glowFactor = 1 - (dist / glowRadius);
                                alpha = 0.25 + glowFactor * 0.7;
                                currentRadius = dotRadius + glowFactor * 1.5;
                                isGlowing = true;
                            }

                            ctx.beginPath();
                            ctx.arc(drawX, drawY, currentRadius, 0, Math.PI * 2);
                            
                            if (isGlowing) {
                                ctx.fillStyle = activeColorHex + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                            } else {
                                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                            }
                            ctx.fill();
                        }
                    }

                    requestAnimationFrame(renderDotField);
                }
                renderDotField();
            }
        }
    </script>
